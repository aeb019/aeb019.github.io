<body>
<script>
"use strict"

function update() {

	var A = $("#A")[0].value;
	var B = $("#B")[0].value;
	var X = A*1;
	var Y = B*1;
	// We need the *1 to tell Javascript to treat X, Y as numbers rather than strings, so that it will treat 150 as greater than 99.
	

	var ACoeffX = 1;
	var BCoeffX = 0;
	var ACoeffY = 0;
	var BCoeffY = 1;
	
	while (X != Y) {
		if ((X < Y) && (X>0)){
			Y = Y - X;
			ACoeffY = ACoeffY + ACoeffX;
			BCoeffY = BCoeffY + BCoeffX;
		}
		else if (Y<X && Y>0) {
			X = X - Y;
			ACoeffX = ACoeffY + ACoeffX;
			BCoeffX = BCoeffY + BCoeffX;
		}
		else { }
	}
	
	
	$("#timesentence").html(X+'='+ACoeffX+'&thinsp;&middot;&thinsp;'+A+ '&minus;'+BCoeffX + '&thinsp;&middot;&thinsp;'+B+' and '+Y+'='+BCoeffY+'&thinsp;&middot;&thinsp;'+B+ '&minus;'+ACoeffY + '&thinsp;&middot;&thinsp;'+A);
}


</script>

<form>
<p><input id="A" size="5" type="text">
<input id="B" size="5" type="text"></p>
</form>

<p id="timesentence"></p>



<p><button onClick='update()'>Compute GCD</button></p>

</body>
</html>
